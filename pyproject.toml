[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "privacy-gateway"
version = "0.2.0"
description = "Local-first, policy-controlled PII anonymization and reversible privacy gateway"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cade Snyder" }]
keywords = ["pii", "privacy", "anonymization", "pseudonymization", "llm", "ai-agents"]
dependencies = [
  "cryptography>=43.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
presidio = ["presidio-analyzer>=2.2.355", "presidio-anonymizer>=2.2.355"]
mcp = ["mcp>=1.2,<2"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
privacy-gateway = "privacy_gateway.cli:app"
privacy-gateway-mcp = "privacy_gateway.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/privacy_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
