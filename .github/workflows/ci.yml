name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.11 and the container ships 3.14; test both ends.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest --cov=privacy_gateway --cov-report=term-missing
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python scripts/check-fixtures.py
      - run: privacy-gateway verify
      # The [mcp] extra allows two SDK lines with different import paths.
      # Exercise the real server on each, not just its source text.
      # The floor, then the newest of each line. -U matters: a satisfied
      # requirement would otherwise leave the previous step's version in place.
      # The floor pins pydantic too. mcp 1.14's fastmcp imports the private
      # pydantic._internal._typing_extra.eval_type_backport, which pydantic 2.14
      # removed (mcp only stopped importing it later in the 1.x line), so a bare
      # `pip install 'mcp==1.14.0'` left the runner's pydantic 2.14 in place and
      # died at import -- the floor cell went red and skipped the two cells
      # below, so nothing exercised any SDK. pydantic<2.14 resolves to 2.13.x,
      # whose pydantic-core ships cp314 wheels, so the floor still runs on every
      # Python in the matrix.
      - name: MCP server on the oldest supported mcp (1.14)
        run: |
          pip install 'mcp==1.14.0' 'pydantic<2.14'
          # A silently satisfied requirement is how this cell broke, so prove the
          # pair imports before the suite runs and fail here instead of inside a
          # pytest collection error.
          python -c "import mcp, pydantic; from importlib.metadata import version; print('mcp', version('mcp'), '| pydantic', pydantic.VERSION)"
          pytest tests/test_mcp_server.py
      - name: MCP server on mcp 1.x
        run: |
          pip install -U 'mcp>=1.14,<2'
          pytest tests/test_mcp_server.py
      - name: MCP server on mcp 2.x
        run: |
          pip install -U 'mcp>=2,<3'
          pytest tests/test_mcp_server.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          # Required to scan pull requests; without it every PR run fails.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: pip install dist/*.whl
      - run: privacy-gateway --help

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/container-smoke.sh

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
